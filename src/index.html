<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FuelTrack</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <div class="header">
            <div><b>FuelTrack</b></div>
            <div>Welcome, TkM | Logout</div>
        </div>
        <div class="container">
            <div class="card">
                <h3>Add Refueling Entry</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Vehicle</label>
                        <select id="vehicle">
                            <option>Two-Wheeler</option>
                            <option>Four-Wheeler</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date">
                    </div>
                    <div class="form-group">
                        <label>Trip Kilometres</label>
                        <input type="number" id="odometer">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Fuel (L)</label>
                        <input type="number" id="fuel" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Cost (₹)</label>
                        <input type="number" id="cost">
                    </div>

                    <button onclick="addEntry()">+ Add Entry</button>
                </div>


            </div>

            <div class="card">
                <h3>Refueling History</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Vehicle</th>
                            <th>Trip Km</th>
                            <th>Fuel</th>
                            <th>Cost</th>
                            <th>Economy</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
